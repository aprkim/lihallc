  body {
    background: var(--liha-gray);
    color: var(--liha-ink);

    font-size: 17px;
    line-height: 1.65;

    padding: 48px 24px;

  main { max-width: 480px; }

  .logo { display: inline-flex; align-items: center; margin-bottom: 44px; }

  .label {

    color: var(--liha-dot);

    font-size: clamp(30px, 6vw, 42px);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }

  p {
    margin-top: 18px;
    font-size: 18px;
    color: var(--muted);
  }

  .back {
    display: inline-block;
    margin-top: 34px;
    font-size: 16px;
    font-weight: 500;
    color: var(--liha-ink);
    text-decoration: none;
    border-bottom: 1px solid var(--liha-ink);
    padding-bottom: 2px;
    transition: color 160ms ease, border-color 160ms ease;
  }
  .back:hover { color: var(--liha-dot); border-color: var(--liha-dot); }
  .back:focus-visible {
    outline: 2px solid var(--liha-ink);
    outline-offset: 4px;
    border-radius: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .back { transition: none; }
  }

  /* touch devices — comfortable tap targets */
  @media (pointer: coarse) {
    .logo, .back { display: inline-flex; align-items: center; min-height: 44px; }
